<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" role="img" aria-label="Tailcove for the agent: One agent, logs and host metrics">
  <defs>
    <radialGradient id="g1" cx="0.16" cy="0.3" r="0.6"><stop offset="0" stop-color="#FF5F2E" stop-opacity="0.30"/><stop offset="1" stop-color="#FF5F2E" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.88" cy="0.92" r="0.55"><stop offset="0" stop-color="#6D6AFF" stop-opacity="0.26"/><stop offset="1" stop-color="#6D6AFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB199"/><stop offset="0.5" stop-color="#FFB199" stop-opacity="0.15"/><stop offset="1" stop-color="#8B8CFF"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFD2C2"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
    <clipPath id="hclip"><rect width="1200" height="556" rx="20"/></clipPath>
    <clipPath id="card"><rect x="640" y="77" width="500" height="267" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#hclip)">
  <rect width="1200" height="556" fill="#0B0D14"/>
  <rect width="1200" height="556" fill="url(#grid)"/>
  <rect width="1200" height="556" fill="url(#g1)"/>
  <rect width="1200" height="556" fill="url(#g2)"/>

  <!-- mark + wordmark + package pill -->
  <g transform="translate(72 64)">
    <linearGradient id="tcTile1" x1="0" y1="0" x2="44.0" y2="44.0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF8A5C"/><stop offset="0.55" stop-color="#FF5F2E"/><stop offset="1" stop-color="#D63A12"/></linearGradient><rect width="44.0" height="44.0" rx="11" fill="url(#tcTile1)"/><g transform="scale(1.375) translate(6 6) scale(0.8333)" fill="#FFFFFF"><rect x="3.5" y="5" width="11" height="4" rx="2"/><rect x="16.5" y="5" width="4" height="4" rx="1.2"/><path d="M7 7v8c0 2.2 1.8 4 4 4h4.5a2 2 0 0 0 0-4h-3.9a.6.6 0 0 1-.6-.6V7Z"/></g>
    <text x="58" y="33" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="url(#word)">tailcove</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500">
    <rect x="252" y="73" width="132" height="26" rx="13" fill="#FF5F2E" fill-opacity="0.12" stroke="#FF5F2E" stroke-opacity="0.45"/>
    <text x="318" y="90.5" text-anchor="middle" fill="#FFB199">tailcove-agent</text>
  </g>

  <!-- headline -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="198" font-size="48" font-weight="700" letter-spacing="-1.4" fill="#F4F5F8">One agent,</text>
    <text x="72" y="254" font-size="48" font-weight="700" letter-spacing="-1.4" fill="url(#word)">logs and host metrics</text>
    <text x="72" y="294" font-size="16" fill="#9399A8">One static binary · follows your files · no dependencies.</text>
  </g>

  <!-- install command -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500">
    <rect x="72" y="326" width="333" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="92" y="351" fill="#FFB199">$</text>
    <text x="110" y="351" fill="#E4E6EE">curl -fsSL .../install.sh | sh</text>
  </g>

  <!-- code card -->
  <rect x="639" y="76" width="502" height="269" rx="15" fill="url(#ring)"/>
  <rect x="640" y="77" width="500" height="267" rx="14" fill="#10121B"/>
  <g clip-path="url(#card)">
    <rect x="640" y="77" width="500" height="38" fill="#FFFFFF" fill-opacity="0.03"/>
    <line x1="640" y1="115.5" x2="1140" y2="115.5" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <circle cx="662" cy="96" r="5" fill="#FF5F57"/><circle cx="680" cy="96" r="5" fill="#FEBC2E"/><circle cx="698" cy="96" r="5" fill="#28C840"/>
    <text x="890" y="101" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6C7283">tailcove-agent.json</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="664" y="149" xml:space="preserve"><tspan fill="#C9CCD6">{</tspan></text>
      <text x="664" y="174" xml:space="preserve"><tspan fill="#C9CCD6">  &quot;token&quot;</tspan><tspan fill="#C9CCD6">: </tspan><tspan fill="#FFB199">&quot;your-source-token&quot;</tspan><tspan fill="#C9CCD6">,</tspan></text>
      <text x="664" y="199" xml:space="preserve"><tspan fill="#C9CCD6">  &quot;logs&quot;</tspan><tspan fill="#C9CCD6">: [</tspan></text>
      <text x="664" y="224" xml:space="preserve"><tspan fill="#C9CCD6">    { </tspan><tspan fill="#C9CCD6">&quot;path&quot;</tspan><tspan fill="#C9CCD6">: </tspan><tspan fill="#FFB199">&quot;/var/log/nginx/*.log&quot;</tspan><tspan fill="#C9CCD6"> }</tspan></text>
      <text x="664" y="249" xml:space="preserve"><tspan fill="#C9CCD6">  ],</tspan></text>
      <text x="664" y="274" xml:space="preserve"><tspan fill="#C9CCD6">  &quot;metrics&quot;</tspan><tspan fill="#C9CCD6">: { </tspan><tspan fill="#C9CCD6">&quot;enabled&quot;</tspan><tspan fill="#C9CCD6">: </tspan><tspan fill="#B4B5FF">true</tspan><tspan fill="#C9CCD6"> }</tspan></text>
      <text x="664" y="299" xml:space="preserve"><tspan fill="#C9CCD6">}</tspan></text>
    </g>
  </g>

