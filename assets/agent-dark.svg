    <g transform="translate(769.8198026106336 449) scale(0.5416666666666666)" fill="none" stroke="#FFB199" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4C6 4 7 9 4 12c3 3 2 8 5 8M15 4c3 0 2 5 5 8-3 3-2 8-5 8"/></g>
    <text x="789.8" y="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.2" fill="#9399A8">CONFIG</text>
    <text x="769.8" y="492" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.8" fill="#F4F5F8">JSON + env</text>
