    <text x="295.4" y="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.2" fill="#9399A8">DEPENDENCIES</text>
    <text x="275.4" y="492" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.8" fill="#F4F5F8">None</text>
    <text x="275.4" y="511" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6C7283">one static binary</text>
    <rect x="446.4" y="452" width="1" height="52" fill="#FFFFFF" fill-opacity="0.09"/>
    <g transform="translate(474.4132441897485 449) scale(0.5416666666666666)" fill="none" stroke="#FFB199" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h5l2-6 4 12 2-6h5"/></g>
    <text x="494.4" y="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.2" fill="#9399A8">SENDS</text>
    <text x="474.4" y="492" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.8" fill="#F4F5F8">Logs + metrics</text>
    <text x="474.4" y="511" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6C7283">files and host figures</text>
