    <text x="100.0" y="511" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A8A85">amd64 and arm64</text>
    <rect x="247.4" y="452" width="1" height="52" fill="#000000" fill-opacity="0.09"/>
