    <text x="295.4" y="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.2" fill="#6F6F6A">DEPENDENCIES</text>
    <text x="275.4" y="492" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.8" fill="#0A0A0A">None</text>
    <text x="275.4" y="511" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A8A85">one static binary</text>
    <rect x="446.4" y="452" width="1" height="52" fill="#000000" fill-opacity="0.09"/>
    <g transform="translate(474.4132441897485 449) scale(0.5416666666666666)" fill="none" stroke="#0F766E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h5l2-6 4 12 2-6h5"/></g>
    <text x="494.4" y="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.2" fill="#6F6F6A">SENDS</text>
    <text x="474.4" y="492" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.8" fill="#0A0A0A">Logs + metrics</text>
    <text x="474.4" y="511" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A8A85">files and host figures</text>
    <rect x="741.8" y="452" width="1" height="52" fill="#000000" fill-opacity="0.09"/>
    <g transform="translate(769.8198026106336 449) scale(0.5416666666666666)" fill="none" stroke="#0F766E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4C6 4 7 9 4 12c3 3 2 8 5 8M15 4c3 0 2 5 5 8-3 3-2 8-5 8"/></g>
    <text x="789.8" y="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.2" fill="#6F6F6A">CONFIG</text>
    <text x="769.8" y="492" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.8" fill="#0A0A0A">JSON + env</text>
    <text x="769.8" y="511" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A8A85">validated on start</text>
