    <circle cx="789.0" cy="372" r="16.5" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.16"/>
    <g transform="translate(781.0 364) scale(0.6666666666666666)" fill="none" stroke="#0A0A0A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="8" height="11" rx="4"/><path d="M12 8V5M9 5.5 10.5 8M15 5.5 13.5 8M4.5 12H8M16 12h3.5M4.5 17H8M16 17h3.5"/></g>
    <text x="1140" y="369" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6B66">systemd · Docker · rotation-safe</text><text x="1140" y="385" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6B66">restarts without repeats</text>
  </g>

  <!-- live stats -->
  <g>
    <rect x="72.5" y="432.5" width="1055" height="91" rx="18" fill="#FFFFFF" fill-opacity="0.62" stroke="#000000" stroke-opacity="0.10"/>
    <g transform="translate(100 449) scale(0.5416666666666666)" fill="none" stroke="#0F766E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></g>
    <text x="120.0" y="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.2" fill="#6F6F6A">PLATFORM</text>
