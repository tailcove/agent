<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-label="One command: Install with a script that checks the download against its SHA-256 sums, or run the container.; Follows your files: Rotation and truncation are handled, globs pick up new files, and a restart neither repeats nor skips lines.; Host metrics: CPU, load, memory, swap, disk and network from the kernel, on the interval you choose.; Safe by default: Plain http to a real host is refused, a token never reaches a log line, switches are parsed strictly.; No dependencies: One static binary built from the Go standard library. Nothing to install around it.; Backs off politely: Failures retry with jittered waits and honour Retry-After. While Tailcove is down it stops reading instead of losing lines.">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.14"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <rect x="0.5" y="0.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="0.5" y="0.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="28" y="26" width="44" height="44" rx="11" fill="#0F766E" fill-opacity="0.08" stroke="#0F766E" stroke-opacity="0.28"/><g transform="translate(38 36) scale(1)" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="m4 17 6-5-6-5M12 19h8"/></g><text x="88" y="56" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">One command</text><text x="28" y="106" font-size="14.5" fill="#5C5C58">Install with a script that checks the</text><text x="28" y="128" font-size="14.5" fill="#5C5C58">download against its SHA-256 sums, or run</text><text x="28" y="150" font-size="14.5" fill="#5C5C58">the container.</text>
  <rect x="412.5" y="0.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="412.5" y="0.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="440" y="26" width="44" height="44" rx="11" fill="#0F766E" fill-opacity="0.08" stroke="#0F766E" stroke-opacity="0.28"/><g transform="translate(450 36) scale(1)" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="M3 12c3-6 6-6 9 0s6 6 9 0"/></g><text x="500" y="56" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Follows your files</text><text x="440" y="106" font-size="14.5" fill="#5C5C58">Rotation and truncation are handled, globs</text><text x="440" y="128" font-size="14.5" fill="#5C5C58">pick up new files, and a restart neither</text><text x="440" y="150" font-size="14.5" fill="#5C5C58">repeats nor skips lines.</text>
  <rect x="824.5" y="0.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="824.5" y="0.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="852" y="26" width="44" height="44" rx="11" fill="#0F766E" fill-opacity="0.08" stroke="#0F766E" stroke-opacity="0.28"/><g transform="translate(862 36) scale(1)" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="M3 12h5l2-6 4 12 2-6h5"/></g><text x="912" y="56" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Host metrics</text><text x="852" y="106" font-size="14.5" fill="#5C5C58">CPU, load, memory, swap, disk and network</text><text x="852" y="128" font-size="14.5" fill="#5C5C58">from the kernel, on the interval you</text><text x="852" y="150" font-size="14.5" fill="#5C5C58">choose.</text>
  <rect x="0.5" y="200.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="0.5" y="200.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="28" y="226" width="44" height="44" rx="11" fill="#0F766E" fill-opacity="0.08" stroke="#0F766E" stroke-opacity="0.28"/><g transform="translate(38 236) scale(1)" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="M12 2l8 3v6c0 5.5-3.5 9.5-8 11-4.5-1.5-8-5.5-8-11V5z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></g><text x="88" y="256" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Safe by default</text><text x="28" y="306" font-size="14.5" fill="#5C5C58">Plain http to a real host is refused, a</text><text x="28" y="328" font-size="14.5" fill="#5C5C58">token never reaches a log line, switches</text><text x="28" y="350" font-size="14.5" fill="#5C5C58">are parsed strictly.</text>
  <rect x="412.5" y="200.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="412.5" y="200.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="440" y="226" width="44" height="44" rx="11" fill="#0F766E" fill-opacity="0.08" stroke="#0F766E" stroke-opacity="0.28"/><g transform="translate(450 236) scale(1)" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="m3 7 9 4 9-4M12 11v10"/></g><text x="500" y="256" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">No dependencies</text><text x="440" y="306" font-size="14.5" fill="#5C5C58">One static binary built from the Go</text><text x="440" y="328" font-size="14.5" fill="#5C5C58">standard library. Nothing to install around</text><text x="440" y="350" font-size="14.5" fill="#5C5C58">it.</text>
  <rect x="824.5" y="200.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="824.5" y="200.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="852" y="226" width="44" height="44" rx="11" fill="#0F766E" fill-opacity="0.08" stroke="#0F766E" stroke-opacity="0.28"/><g transform="translate(862 236) scale(1)" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="M13 2 4 14h7l-1 8 10-13h-7z"/></g><text x="912" y="256" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Backs off politely</text><text x="852" y="306" font-size="14.5" fill="#5C5C58">Failures retry with jittered waits and</text><text x="852" y="328" font-size="14.5" fill="#5C5C58">honour Retry-After. While Tailcove is down</text><text x="852" y="350" font-size="14.5" fill="#5C5C58">it stops reading instead of losing lines.</text>
  </g>
</svg>
