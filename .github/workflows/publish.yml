name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # The packages are built and installed (deb, and rpm in three distributions) before anything is published.
  packages:
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test
        run: go test -race -count=1 ./...
      - name: Release binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/packages
      - name: Attach the packages to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/packages/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: |
          number="${GITHUB_REF_NAME#v}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          # The image tag `latest` moves only for a final release, never for a release candidate.
          case "$number" in
            *-*) echo "latest=" >> "$GITHUB_OUTPUT" ;;
            *) echo "latest=ghcr.io/tailcove/agent:latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.number }}
          tags: |
            ghcr.io/tailcove/agent:${{ steps.version.outputs.number }}
            ${{ steps.version.outputs.latest }}
