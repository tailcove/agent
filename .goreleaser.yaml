version: 2

project_name: tailcove-agent

builds:
  - main: ./cmd/tailcove-agent
    binary: tailcove-agent
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "tailcove-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - tailcove-agent.example.json

checksum:
  name_template: checksums.txt

release:
  # A tag with a prerelease part (v0.2.0-rc.0) is published as a pre-release, so it is never the latest release.
  prerelease: auto
  extra_files:
    - glob: install.sh
    - glob: packaging/tailcove-agent.service
    - glob: packaging/com.tailcove.agent.plist

changelog:
  disable: true
